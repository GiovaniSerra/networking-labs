enable
configure terminal
hostname SW-CORE-01
no ip domain-lookup
line console 0
 logging synchronous
exit

! Enable L3 Routing
ip routing

! VLAN Provisioning
vlan 99
 name MANAGEMENT
vlan 100
 name SERVERS
vlan 110
 name ENGINEERING_VLAN110
vlan 120
 name SALES_VLAN120
exit

! Core SVI Gateways
interface Vlan110
 ip address 192.168.110.1 255.255.255.0
 no shutdown
exit

interface Vlan120
 ip address 192.168.120.1 255.255.255.0
 no shutdown
exit

! Channel-Group 2 (Downlink to SW-ACCESS-01)
interface range Ethernet0/0 - 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 2 mode active
 no shutdown
exit

! Channel-Group 4 (Cross Downlink to SW-ACCESS-02)
interface range Ethernet1/2 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 4 mode active
 no shutdown
exit

! Channel-Group 6 (L3 Routed Core Interconnect to SW-CORE-02)
interface range Ethernet0/2 - 3
 no switchport
 channel-group 6 mode active
 no shutdown
exit

interface Port-channel 6
 no switchport
 ip address 10.1.1.1 255.255.255.0
 no shutdown
end
