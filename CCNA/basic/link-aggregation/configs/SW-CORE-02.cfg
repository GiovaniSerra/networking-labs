enable
configure terminal
hostname SW-CORE-02
no ip domain-lookup
line console 0
 logging synchronous
exit

! Enable L3 Routing
ip routing

! VLAN Provisioning
vlan 99
 name MANAGEMENT
vlan 100
 name SERVERS
vlan 110
 name ENGINEERING_VLAN110
vlan 120
 name SALES_VLAN120
exit

! Channel-Group 3 (Cross Downlink to SW-ACCESS-01)
interface range Ethernet1/2 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 3 mode active
 no shutdown
exit

! Channel-Group 5 (Downlink to SW-ACCESS-02)
interface range Ethernet0/0 - 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 5 mode active
 no shutdown
exit

! Channel-Group 6 (L3 Routed Core Interconnect to SW-CORE-01)
interface range Ethernet0/2 - 3
 no switchport
 channel-group 6 mode active
 no shutdown
exit

interface Port-channel 6
 no switchport
 ip address 10.1.1.2 255.255.255.0
 no shutdown
end
