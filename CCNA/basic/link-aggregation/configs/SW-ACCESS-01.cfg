enable
configure terminal
hostname SW-ACCESS-01
no ip domain-lookup
line console 0
 logging synchronous
exit

! VLAN Provisioning
vlan 99
 name MANAGEMENT
vlan 100
 name SERVERS
vlan 110
 name ENGINEERING_VLAN110
vlan 120
 name SALES_VLAN120
exit

! Channel-Group 1 (Access Peer-Link to SW-ACCESS-02)
interface range GigabitEthernet1/0 - 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 1 mode active
 no shutdown
exit

! Channel-Group 2 (Primary Uplink to SW-CORE-01)
interface range GigabitEthernet0/0 - 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 2 mode active
 no shutdown
exit

! Channel-Group 3 (Cross Uplink to SW-CORE-02)
interface range GigabitEthernet0/2 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 99,100,110,120
 channel-group 3 mode active
 no shutdown
exit

! Host Access Port (VPC1)
interface GigabitEthernet1/2
 switchport mode access
 switchport access vlan 110
 no shutdown
end
