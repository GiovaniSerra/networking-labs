 duplex full
 no shut


interface fa1/0
 description REDE VERDE
 ip address 10.13.0.1 255.255.255.252
 ip ospf 10 area 30
 duplex full
 no shut
!
interface fa2/0
 description REDE VERMELHA
 ip address 10.12.0.1 255.255.255.252
 ip ospf 10 area 20
 duplex full
 no shut

!
interface Loopback0
 ip address 10.0.0.1 255.255.255.0
 ip ospf 10 area 0
 ip ospf network point-to-point
end
